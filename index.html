<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F4F1">
<meta name="description" content="一年 50 次、每次 1 小时，拿下明年年卡">
<title>健身打卡 · 50 次挑战</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<script>
(function () {
  try {
    var t = localStorage.getItem('gym50.theme');
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch (e) { /* default light */ }
})();
</script>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="13" r="8"/>
      <path d="M12 9.5V13l2.5 2.5"/>
      <path d="M10 2.5h4"/>
      <path d="M12 2.5V5"/>
    </svg>
    <div class="brand-text">
      <h1><span class="num" id="titleTarget">50</span> 次挑战</h1>
      <p class="year-range" id="yearRange"></p>
    </div>
  </div>
  <div class="top-actions">
    <button id="btnTheme" class="icon-btn" aria-label="切换深色模式">
      <svg id="icoMoon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      <svg id="icoSun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" class="hidden"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
    <button id="btnSettings" class="icon-btn" aria-label="设置">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5h.1a1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main>
  <section class="card tally" aria-label="总进度">
    <div class="tally-head">
      <div class="hero">
        <span class="num hero-num" id="doneCount">0</span>
        <span class="hero-of">/ <span class="num" id="targetCount">50</span> 次</span>
      </div>
      <span class="chip" id="paceChip"></span>
    </div>
    <div class="dots" id="dots" role="img"></div>
    <p class="tally-foot" id="tallyFoot"></p>
  </section>

  <section class="card timer" aria-label="今日训练">
    <h2>今日训练</h2>
    <div class="ring-wrap">
      <svg id="ring" viewBox="0 0 220 220" aria-hidden="true">
        <circle class="ring-track" cx="110" cy="110" r="96"/>
        <circle class="ring-fill" id="ringFill" cx="110" cy="110" r="96"/>
      </svg>
      <div class="ring-center">
        <div class="ring-time num" id="ringTime">00:00</div>
        <div class="ring-goal" id="ringGoal">目标 60 分钟</div>
        <span class="chip chip-good hidden" id="ringBadge"></span>
      </div>
    </div>
    <div class="timer-actions">
      <button class="btn btn-primary" id="btnTimer">开始训练</button>
      <button class="btn btn-ghost hidden" id="btnFinish">结束训练</button>
      <button class="btn btn-ghost btn-danger hidden" id="btnDiscard">放弃本次</button>
    </div>
  </section>

  <section class="stats" aria-label="统计">
    <div class="stat"><span class="stat-label">本月次数</span><span class="stat-value"><span class="num" id="stMonth">0</span></span></div>
    <div class="stat"><span class="stat-label">连续达标周</span><span class="stat-value"><span class="num" id="stStreak">0</span></span></div>
    <div class="stat"><span class="stat-label">平均时长</span><span class="stat-value"><span class="num" id="stAvg">–</span><span class="stat-unit">分</span></span></div>
    <div class="stat"><span class="stat-label">剩余天数</span><span class="stat-value"><span class="num" id="stDays">0</span></span></div>
  </section>

  <section class="card" aria-label="累计进度图">
    <div class="card-head">
      <h2>累计进度</h2>
      <div class="legend">
        <span class="legend-item"><i class="key key-actual"></i>实际</span>
        <span class="legend-item"><i class="key key-pace"></i>匀速节奏</span>
      </div>
    </div>
    <svg id="lineChart" tabindex="0"></svg>
  </section>

  <section class="card" aria-label="全年记录热力图">
    <div class="card-head">
      <h2>全年记录</h2>
      <div class="legend">
        <span class="legend-item">少</span>
        <i class="sw sw0"></i><i class="sw sw1"></i><i class="sw sw2"></i><i class="sw sw3"></i>
        <span class="legend-item">多</span>
      </div>
    </div>
    <div class="heat-scroll"><svg id="heatmap"></svg></div>
  </section>

  <section class="card" aria-label="训练记录">
    <div class="card-head">
      <h2>训练记录</h2>
      <button class="btn btn-small btn-ghost" id="btnAdd">补记一次</button>
    </div>
    <ul class="log" id="log"></ul>
    <p class="empty hidden" id="logEmpty">还没有记录。开始今天的训练，或补记一次历史训练。</p>
  </section>
</main>

<dialog id="dlgSession" class="dlg">
  <form id="formSession" novalidate>
    <h3 id="dlgSessionTitle">补记训练</h3>
    <div class="field">
      <label for="fDate">日期</label>
      <input type="date" id="fDate" required>
    </div>
    <div class="field">
      <label for="fMin">时长（分钟）</label>
      <input type="number" id="fMin" min="1" max="600" step="1" inputmode="numeric" required>
    </div>
    <p class="field-err hidden" id="sessionErr"></p>
    <div class="dlg-actions">
      <button type="button" class="btn btn-ghost btn-danger hidden" id="btnDeleteSession">删除</button>
      <span class="dlg-spacer"></span>
      <button type="button" class="btn btn-ghost" id="btnSessionCancel">取消</button>
      <button type="submit" class="btn btn-primary">保存</button>
    </div>
  </form>
</dialog>

<dialog id="dlgSettings" class="dlg">
  <form id="formSettings" novalidate>
    <h3>挑战设置</h3>
    <div class="field">
      <label for="fStart">开始日期</label>
      <input type="date" id="fStart" required>
    </div>
    <div class="field">
      <label for="fTarget">目标次数（次）</label>
      <input type="number" id="fTarget" min="1" max="365" step="1" inputmode="numeric" required>
    </div>
    <div class="field">
      <label for="fGoalMin">每次达标时长（分钟）</label>
      <input type="number" id="fGoalMin" min="1" max="300" step="5" inputmode="numeric" required>
    </div>
    <p class="field-err hidden" id="settingsErr"></p>
    <div class="dlg-actions">
      <button type="button" class="btn btn-ghost btn-danger" id="btnReset">清空数据</button>
      <span class="dlg-spacer"></span>
      <button type="button" class="btn btn-ghost" id="btnSettingsCancel">取消</button>
      <button type="submit" class="btn btn-primary">保存</button>
    </div>
  </form>
</dialog>

<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>
<div class="tooltip hidden" id="tooltip"></div>

<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
